name: Stress

# Repeats timing-sensitive tests many times on every OS to catch flakiness that a single
# CI run cannot. Runs automatically when those packages change, or on demand.
on:
  pull_request:
    paths:
      - "internal/procs/**"
      - "internal/store/**"
      - "internal/runtime/**"
      - "internal/verify/**"
      - ".github/workflows/stress.yml"
  workflow_dispatch:
    inputs:
      count:
        description: "Repetitions per test"
        default: "50"
        required: true

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Stress
        shell: bash
        env:
          COUNT: ${{ inputs.count || '50' }}
        run: go test -race -timeout 45m -count="$COUNT" ./internal/procs/... ./internal/store/... ./internal/runtime/... ./internal/verify/...
